<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>사원 목록 · 사원관리</title>
  <link rel="stylesheet" href="css/basic.css">
  <link rel="stylesheet" href="css/component.css">
  <link rel="stylesheet" href="css/app-shell.css">
  <link rel="stylesheet" href="css/hr.css">
  <script src="js/component.js" defer></script>
</head>
<body>
	
  <!-- 공통 메뉴 — templates/hr/_menu.html 참고 (Thymeleaf 전환 시 fragment 로) -->
  <header th:replace="~{./fragments/layout :: header}"></header>

  <main class="app-main container container--wide">
    <div class="page-head">
      <div>
        <h1>사원 목록</h1>
        <p>검색결과 [[${totalCnt}]]명</p>
      </div>
      <a class="btn btn--primary" href="emp-form.html">+ 사원 등록</a>
    </div>

    <!--
      처리 결과(플래시) 메시지 자리.
      등록/수정/삭제 후 목록으로 redirect(PRG) 하면서 RedirectAttributes 로 넘긴 메시지를 여기 렌더링한다.
      Thymeleaf: <div class="alert alert--success" role="status" th:if="${msg}" th:text="${msg}"></div>
      아래는 "방금 저장하고 돌아온" 상태 예시 (서버에서는 조건부로만 노출).
    -->
    <div class="alert alert--success mb-4" role="status">
      <span class="alert__icon" aria-hidden="true">✓</span>
      <div class="alert__body">새 사원이 등록되었습니다.</div>
      <button class="alert__close" type="button" data-dismiss="alert" aria-label="닫기">×</button>
    </div>

    <!--
      검색/필터 : 실제 서버 연동을 대비해 GET 폼으로 만든다.
      - method="get" 이라 조건이 URL 쿼리스트링에 남는다 → 새로고침·북마크·뒤로가기·페이징에 그대로 재사용
      - 페이지네이션 링크도 같은 파라미터를 이어붙인다: ?keyword=&deptId=&workingOnly=&sort=&page=2
      - Thymeleaf 전환: th:value="${param.keyword}", 선택 유지 th:selected, 페이징은 @{/emps(keyword=${param.keyword}, page=${i})}
    -->
    <form class="toolbar" th:object="${cond}" method="get" action="/emps">
      <div class="input-group">
        <input class="input" type="search" th:field="*{keyword}" placeholder="이름 · 사번 · 이메일" aria-label="검색어" style="min-width: 240px">
        <button class="btn btn--secondary" type="submit">검색</button>
      </div>
      <select class="select" th:field="*{deptId}" aria-label="부서" style="width: 150px">
        <option value="">전체 부서</option>
        <option th:each="d : ${depts}" th:value="${d.deptId}" th:text="${d.deptTitle}"></option>
      </select>
      <label class="switch">
        <input type="checkbox" th:field="*{workingOnly}">
        <span class="switch__track"><span class="switch__thumb"></span></span>
        <span class="switch__label">재직자만</span>
      </label>
      <span class="spacer"></span>
      <select class="select" th:field="*{sort}" aria-label="정렬" style="width: 130px">
        <option value="HIRE_DATE">입사일순</option>
        <option value="NAME">이름순</option>
        <option value="SALARY">급여순</option>
        <option value="EMP_ID">사번순</option>
      </select>
      <a class="btn btn--ghost btn--sm" href="/emps">초기화</a>
    </form>

    <!--
      결과가 0건일 때는 표 대신 빈 상태를 보여준다.
      Thymeleaf: <div class="empty-state" th:if="${#lists.isEmpty(emps)}"> ... </div>
                 <div class="table-wrap" th:unless="${#lists.isEmpty(emps)}"> ...표... </div>
      <div class="empty-state">
        <p class="empty-state__icon" aria-hidden="true">📭</p>
        <p class="empty-state__title">조건에 맞는 사원이 없습니다</p>
        <p class="empty-state__desc">검색어나 필터를 바꿔 다시 시도해 보세요.</p>
        <a class="btn btn--secondary btn--sm" href="index.html">필터 초기화</a>
      </div>
    -->

    <!-- 목록 테이블 -->
    <div class="table-wrap">
      <table class="table">
        <thead>
          <tr>
            <th>사번</th><th>이름</th><th>부서</th><th>입사일</th><th>상태</th><th>관리</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="emp : ${list}">
            <td th:text="${emp.empId}">200</td>
			<!-- th:href = "@{경로(파라메터이름=${값})}"-->
            <td><a th:href="@{emp-detail(empId=${emp.empId})}" th:text="${emp.empName}">곽상혁</a></td>
            <td th:text="${emp.deptName}">총무부</td><td th:text="${emp.hireDate}">2013-03-02</td>
            <td>
				<span class="badge badge--success badge--dot"
					th:if="${emp.active}">재직</span>
				<span class="badge badge--danger badge--dot"
					th:if="${not emp.active}">퇴직</span>
			</td>
            <td class="row-actions"><a th:href="@{emp-detail(empId=${emp.empId})}">상세</a><a href="emp-form.html">수정</a></td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- 페이징: 검색 조건(cond)을 그대로 이어붙여야 페이지를 넘겨도 검색이 유지된다 -->
    <nav class="pagination mt-6" aria-label="페이지" th:if="${pageDto.ePageNo >= pageDto.sPageNo}">
      <a class="pagination__item" th:if="${pageDto.prev}"
         th:href="@{/emps(keyword=${cond.keyword}, deptId=${cond.deptId}, workingOnly=${cond.workingOnly}, sort=${cond.sort}, page=${pageDto.sPageNo - 1})}"
         aria-label="이전">‹</a>
      <a class="pagination__item"
         th:each="p : ${#numbers.sequence(pageDto.sPageNo, pageDto.ePageNo)}"
         th:href="@{/emps(keyword=${cond.keyword}, deptId=${cond.deptId}, workingOnly=${cond.workingOnly}, sort=${cond.sort}, page=${p})}"
         th:text="${p}"
         th:classappend="${p == pageDto.page} ? 'is-current' : ''"
         th:attr="aria-current=${p == pageDto.page} ? 'page' : null"></a>
      <a class="pagination__item" th:if="${pageDto.next}"
         th:href="@{/emps(keyword=${cond.keyword}, deptId=${cond.deptId}, workingOnly=${cond.workingOnly}, sort=${cond.sort}, page=${pageDto.ePageNo + 1})}"
         aria-label="다음">›</a>
    </nav>
  </main>

  <footer class="site-footer" th:replace="~{./fragments/layout :: footer}">
    <div class="container container--wide row row--between">
      <p>👔 사원관리 · 학습용 프로토타입</p>
      <span class="muted" style="font-size: var(--text-sm)">디자인 시스템: /css/basic.css</span>
    </div>
  </footer>
</body>
</html>
