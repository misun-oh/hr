<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>사원 목록 · 사원관리</title>
  <link rel="stylesheet" th:href="@{/css/basic.css}">
  <link rel="stylesheet" th:href="@{/css/component.css}">
  <link rel="stylesheet" th:href="@{/css/app-shell.css}">
  <link rel="stylesheet" th:href="@{/css/hr.css}">
  <script th:src="@{/js/component.js}" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner container container--wide">
      <a class="site-header__brand" th:href="@{/emps}">👔 사원관리</a>
      <nav class="site-nav hide-mobile" aria-label="주요 메뉴">
        <a th:href="@{/emps}" aria-current="page">사원 목록</a>
        <a th:href="@{/depts}">부서</a>
        <a th:href="@{/dashboard}">대시보드</a>
      </nav>
      <span class="spacer"></span>
      <button class="btn btn--ghost btn--sm" type="button" data-theme-toggle aria-label="다크 모드 전환">🌓</button>
      <a class="btn btn--primary btn--sm" th:href="@{/login}">로그인</a>
    </div>
  </header>

  <main class="app-main container container--wide">
    <div class="page-head">
      <div>
        <h1>사원 목록</h1>
        <p>전체 [[${totalCnt}]]명 · 검색결과 [[${filteredCnt}]]명</p>
      </div>
      <a class="btn btn--primary" th:href="@{/emp-form}">+ 사원 등록</a>
    </div>

    <!-- 검색/필터 : GET 폼이라 조건이 URL 쿼리스트링에 남는다 -->
    <form class="toolbar" method="get" th:action="@{/emps}">
      <div class="input-group">
        <input class="input" type="search" name="keyword" th:value="${cond.keyword}"
               placeholder="이름 · 사번 · 이메일" aria-label="검색어" style="min-width: 240px">
        <button class="btn btn--secondary" type="submit">검색</button>
      </div>
      <select class="select" name="deptId" aria-label="부서" style="width: 150px">
        <option value="">전체 부서</option>
        <option th:each="d : ${depts}" th:value="${d.code}" th:text="${d.name}"
                th:selected="${d.code == cond.deptId}">부서명</option>
      </select>
      <label class="switch">
        <input type="checkbox" name="workingOnly" value="true" th:checked="${cond.workingOnly}">
        <span class="switch__track"><span class="switch__thumb"></span></span>
        <span class="switch__label">재직자만</span>
      </label>
      <span class="spacer"></span>
      <select class="select" name="sort" aria-label="정렬" style="width: 130px">
        <option value="hireDate" th:selected="${cond.sort == 'hireDate'}">입사일순</option>
        <option value="name" th:selected="${cond.sort == 'name'}">이름순</option>
        <option value="salary" th:selected="${cond.sort == 'salary'}">급여순</option>
      </select>
      <a class="btn btn--ghost btn--sm" th:href="@{/emps}">초기화</a>
    </form>

    <!-- 결과가 0건일 때는 표 대신 빈 상태를 보여준다 -->
    <div class="empty-state" th:if="${#lists.isEmpty(list)}">
      <p class="empty-state__icon" aria-hidden="true">📭</p>
      <p class="empty-state__title">조건에 맞는 사원이 없습니다</p>
      <p class="empty-state__desc">검색어나 필터를 바꿔 다시 시도해 보세요.</p>
      <a class="btn btn--secondary btn--sm" th:href="@{/emps}">필터 초기화</a>
    </div>

    <!-- 목록 테이블 -->
    <div class="table-wrap" th:unless="${#lists.isEmpty(list)}">
      <table class="table">
        <thead>
          <tr>
            <th>사번</th><th>이름</th><th>부서</th><th>직급</th><th>입사일</th><th>상태</th><th>관리</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="emp : ${list}">
            <td th:text="${emp.empId}">200</td>
            <td><a th:href="@{/emp-detail(empId=${emp.empId})}" th:text="${emp.empName}">곽상혁</a></td>
            <td th:text="${emp.deptName} ?: '미배정'">총무부</td>
            <td th:text="${emp.jobName}">대표</td>
            <td th:text="${emp.hireDate}">2013-03-02</td>
            <td>
				<span class="badge badge--success badge--dot"
					th:if="${emp.active}">재직</span>
				<span class="badge badge--danger badge--dot"
					th:if="${not emp.active}">퇴직</span>
			</td>
            <td class="row-actions">
              <a th:href="@{/emp-detail(empId=${emp.empId})}">상세</a>
              <a th:href="@{/emp-form(empId=${emp.empId})}">수정</a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- 페이징: 검색 조건을 그대로 이어붙여 유지한다 -->
    <nav class="pagination mt-6" aria-label="페이지" th:if="${totalPages > 1}">
      <a class="pagination__item"
         th:href="@{/emps(keyword=${cond.keyword}, deptId=${cond.deptId}, workingOnly=${cond.workingOnly}, sort=${cond.sort}, page=${cond.page - 1})}"
         th:classappend="${cond.page <= 1} ? 'is-disabled'" aria-label="이전">‹</a>
      <a class="pagination__item" th:each="i : ${#numbers.sequence(1, totalPages)}"
         th:href="@{/emps(keyword=${cond.keyword}, deptId=${cond.deptId}, workingOnly=${cond.workingOnly}, sort=${cond.sort}, page=${i})}"
         th:text="${i}"
         th:attr="aria-current=${i == cond.page} ? 'page' : null">1</a>
      <a class="pagination__item"
         th:href="@{/emps(keyword=${cond.keyword}, deptId=${cond.deptId}, workingOnly=${cond.workingOnly}, sort=${cond.sort}, page=${cond.page + 1})}"
         th:classappend="${cond.page >= totalPages} ? 'is-disabled'" aria-label="다음">›</a>
    </nav>
  </main>

  <footer class="site-footer">
    <div class="container container--wide row row--between">
      <p>👔 사원관리 · 학습용 프로토타입</p>
      <span class="muted" style="font-size: var(--text-sm)">디자인 시스템: /css/basic.css</span>
    </div>
  </footer>
</body>
</html>
