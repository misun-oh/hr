<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>사원 등록 · 사원관리</title>
  <link rel="stylesheet" href="css/basic.css">
  <link rel="stylesheet" href="css/component.css">
  <link rel="stylesheet" href="css/app-shell.css">
  <link rel="stylesheet" href="css/hr.css">
  <script src="js/component.js" defer></script>
</head>
<body>
  <!-- 공통 메뉴 — templates/hr/_menu.html 참고 (Thymeleaf 전환 시 fragment 로) -->
  <header class="site-header" th:replace="~{./fragments/layout :: header}">
    <div class="site-header__inner container container--wide">
      <a class="site-header__brand" href="index.html">👔 사원관리</a>
      <nav class="site-nav hide-mobile" aria-label="주요 메뉴">
        <a href="index.html" aria-current="page">사원 목록</a>
        <a href="depts.html">부서</a>
        <a href="dashboard.html">대시보드</a>
      </nav>
      <span class="spacer"></span>
      <button class="btn btn--ghost btn--sm" type="button" data-theme-toggle aria-label="다크 모드 전환">🌓</button>
      <a class="btn btn--primary btn--sm" href="login.html">로그인</a>
    </div>
  </header>

  <main class="app-main container">
    <nav class="breadcrumb mb-4" aria-label="현재 위치">
      <a th:href="@{/emps}">사원 목록</a>
      <span aria-current="page">사원 등록</span>
    </nav>

    <div class="page-head">
      <div>
        <h1>사원 등록</h1>
        <p>새 사원의 기본 정보를 입력합니다. <span class="muted">* 표시는 필수 항목</span></p>
      </div>
    </div>

    <form class="card" style="padding: var(--space-6)" data-emp-form
          th:action="@{/emps}" th:object="${form}" method="post" enctype="multipart/form-data">
      <div class="form-grid">
        <div class="field">
          <label class="label" for="f-name">이름 *</label>
          <input class="input" id="f-name" th:field="*{empName}" placeholder="홍길동">
          <p class="form-hint" th:if="${#fields.hasErrors('empName')}" th:errors="*{empName}"></p>
        </div>
        <div class="field">
          <label class="label" for="f-no">사번 *</label>
          <input class="input" id="f-no" th:field="*{empNo}" placeholder="EMP2026001">
          <p class="form-hint" th:if="${#fields.hasErrors('empNo')}" th:errors="*{empNo}"></p>
        </div>

        <div class="field">
          <label class="label" for="f-email">이메일 *</label>
          <input class="input" id="f-email" th:field="*{email}" placeholder="hong@company.com">
          <p class="form-hint" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
        </div>
        <div class="field">
          <label class="label" for="f-phone">전화번호</label>
          <input class="input" id="f-phone" th:field="*{phone}" placeholder="010-0000-0000">
          <p class="form-hint" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></p>
        </div>

        <div class="field">
          <label class="label" for="f-dept">부서 *</label>
          <select class="select" id="f-dept" th:field="*{deptId}">
            <option value="">선택하세요</option>
            <option th:each="d : ${depts}" th:value="${d.deptId}" th:text="${d.deptTitle}"></option>
          </select>
          <p class="form-hint" th:if="${#fields.hasErrors('deptId')}" th:errors="*{deptId}"></p>
        </div>
        <div class="field">
          <label class="label" for="f-salary">기본급(월) *</label>
          <input class="input" id="f-salary" th:field="*{salary}" type="number" min="0" step="10000" placeholder="2500000">
          <p class="form-hint" th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}"></p>
        </div>

        <div class="field">
          <label class="label" for="f-hire">입사일 *</label>
          <input class="input" id="f-hire" th:field="*{hireDate}" type="date">
          <p class="form-hint" th:if="${#fields.hasErrors('hireDate')}" th:errors="*{hireDate}"></p>
        </div>

        <div class="field field--full">
          <label class="label" for="f-images">첨부 이미지</label>
          <input class="input" id="f-images" name="images" type="file" multiple
                 accept="image/jpeg,image/png,image/webp">
          <p class="form-hint" th:if="${imageError}" th:text="${imageError}"></p>
          <p class="form-hint">JPG, PNG, WEBP / 장당 최대 5MB, 최대 5장</p>
        </div>
      </div>

      <div class="row row--between mt-6">
        <a class="btn btn--ghost" th:href="@{/emps}">← 목록으로</a>
        <div class="row" style="--gap: var(--space-2)">
          <a class="btn btn--secondary" th:href="@{/emps}">취소</a>
          <button class="btn btn--primary" type="submit">저장</button>
        </div>
      </div>
    </form>
  </main>

  <footer class="site-footer" th:replace="~{./fragments/layout :: footer}">
    <div class="container container--wide row row--between">
      <p>👔 사원관리 · 학습용 프로토타입</p>
      <span class="muted" style="font-size: var(--text-sm)">디자인 시스템: /css/basic.css</span>
    </div>
  </footer>

</body>
</html>
