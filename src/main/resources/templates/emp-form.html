<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${emp.empId} != null ? '사원 수정 · 사원관리' : '사원 등록 · 사원관리'">사원 등록 · 사원관리</title>
  <link rel="stylesheet" th:href="@{/css/basic.css}">
  <link rel="stylesheet" th:href="@{/css/component.css}">
  <link rel="stylesheet" th:href="@{/css/app-shell.css}">
  <link rel="stylesheet" th:href="@{/css/hr.css}">
  <script th:src="@{/js/component.js}" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner container container--wide">
      <a class="site-header__brand" th:href="@{/emps}">👔 사원관리</a>
      <nav class="site-nav hide-mobile" aria-label="주요 메뉴">
        <a th:href="@{/emps}" aria-current="page">사원 목록</a>
        <a th:href="@{/depts}">부서</a>
        <a th:href="@{/dashboard}">대시보드</a>
      </nav>
      <span class="spacer"></span>
      <button class="btn btn--ghost btn--sm" type="button" data-theme-toggle aria-label="다크 모드 전환">🌓</button>
      <a class="btn btn--primary btn--sm" th:href="@{/login}">로그인</a>
    </div>
  </header>

  <main class="app-main container">
    <nav class="breadcrumb mb-4" aria-label="현재 위치">
      <a th:href="@{/emps}">사원 목록</a>
      <span aria-current="page" th:text="${emp.empId} != null ? '사원 수정' : '사원 등록'">사원 등록</span>
    </nav>

    <div class="page-head">
      <div>
        <h1 th:text="${emp.empId} != null ? '사원 수정' : '사원 등록'">사원 등록</h1>
        <p>사원의 기본 정보를 입력합니다. <span class="muted">* 표시는 필수 항목</span></p>
      </div>
    </div>

    <form class="card" style="padding: var(--space-6)" method="post" th:action="@{/emp-save}" th:object="${emp}">
      <input type="hidden" th:field="*{empId}">

      <div class="form-grid">
        <div class="field">
          <label class="label" for="f-name">이름 *</label>
          <input class="input" id="f-name" th:field="*{empName}" placeholder="홍길동" required>
        </div>
        <div class="field">
          <label class="label" for="f-no">주민등록번호 *</label>
          <input class="input" id="f-no" th:field="*{empNo}" placeholder="900101-1234567" required>
        </div>

        <div class="field">
          <label class="label" for="f-email">이메일 *</label>
          <input class="input" id="f-email" th:field="*{email}" type="email" placeholder="hong@company.com" required>
        </div>
        <div class="field">
          <label class="label" for="f-phone">전화번호</label>
          <input class="input" id="f-phone" th:field="*{phone}" placeholder="010-0000-0000">
        </div>

        <div class="field">
          <label class="label" for="f-dept">부서</label>
          <select class="select" id="f-dept" th:field="*{deptId}">
            <option value="">선택하세요</option>
            <option th:each="d : ${depts}" th:value="${d.code}" th:text="${d.name}">부서명</option>
          </select>
        </div>
        <div class="field">
          <label class="label" for="f-job">직급 *</label>
          <select class="select" id="f-job" th:field="*{jobCode}" required>
            <option value="">선택하세요</option>
            <option th:each="j : ${jobs}" th:value="${j.code}" th:text="${j.name}">직급명</option>
          </select>
        </div>

        <div class="field">
          <label class="label" for="f-salary">기본급(월) *</label>
          <input class="input" id="f-salary" th:field="*{salary}" type="number" min="0" step="10000" required>
        </div>
        <div class="field">
          <label class="label" for="f-hire">입사일 *</label>
          <input class="input" id="f-hire" th:field="*{hireDate}" type="date" required>
        </div>

        <div class="field">
          <label class="label" for="f-bonus">보너스율 (0~1)</label>
          <input class="input" id="f-bonus" th:field="*{bonus}" type="number" min="0" max="1" step="0.01" placeholder="0.15">
        </div>
        <div class="field">
          <label class="label" for="f-mgr">관리자</label>
          <select class="select" id="f-mgr" th:field="*{managerId}">
            <option value="">없음</option>
            <option th:each="m : ${managers}" th:value="${m.code}" th:text="${m.name}"
                    th:unless="${m.code == emp.empId}">관리자명</option>
          </select>
        </div>

        <div class="field">
          <span class="label">재직 여부</span>
          <label class="switch">
            <input type="checkbox" th:field="*{active}">
            <span class="switch__track"><span class="switch__thumb"></span></span>
            <span class="switch__label">재직</span>
          </label>
        </div>
      </div>

      <div class="row row--between mt-6">
        <a class="btn btn--ghost" th:href="@{/emps}">← 목록으로</a>
        <div class="row" style="--gap: var(--space-2)">
          <a class="btn btn--secondary" th:href="@{/emps}">취소</a>
          <button class="btn btn--primary" type="submit">저장</button>
        </div>
      </div>
    </form>
  </main>

  <footer class="site-footer">
    <div class="container container--wide row row--between">
      <p>👔 사원관리 · 학습용 프로토타입</p>
      <span class="muted" style="font-size: var(--text-sm)">디자인 시스템: /css/basic.css</span>
    </div>
  </footer>
</body>
</html>
