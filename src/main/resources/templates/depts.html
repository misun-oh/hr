<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>부서 · 사원관리</title>
  <link rel="stylesheet" th:href="@{/css/basic.css}">
  <link rel="stylesheet" th:href="@{/css/component.css}">
  <link rel="stylesheet" th:href="@{/css/app-shell.css}">
  <link rel="stylesheet" th:href="@{/css/hr.css}">
  <script th:src="@{/js/modal.js}" defer></script>
  <script th:src="@{/js/component.js}" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner container container--wide">
      <a class="site-header__brand" th:href="@{/emps}">👔 사원관리</a>
      <nav class="site-nav hide-mobile" aria-label="주요 메뉴">
        <a th:href="@{/emps}">사원 목록</a>
        <a th:href="@{/depts}" aria-current="page">부서</a>
        <a th:href="@{/dashboard}">대시보드</a>
      </nav>
      <span class="spacer"></span>
      <button class="btn btn--ghost btn--sm" type="button" data-theme-toggle aria-label="다크 모드 전환">🌓</button>
      <a class="btn btn--primary btn--sm" th:href="@{/login}">로그인</a>
    </div>
  </header>

  <main class="app-main container container--wide">
    <div class="page-head">
      <div>
        <h1>부서</h1>
        <p>전체 [[${totalCnt}]]개 부서</p>
      </div>
      <button class="btn btn--primary" type="button" data-modal-open="dept-modal">+ 부서 추가</button>
    </div>

    <div class="alert alert--danger mb-4" th:if="${errorMessage}">
      <span class="alert__icon">⚠</span>
      <span class="alert__body" th:text="${errorMessage}">에러 메시지</span>
    </div>

    <div class="table-wrap">
      <table class="table table--striped">
        <thead>
          <tr><th>코드</th><th>부서명</th><th>근무지</th><th>인원</th><th>평균 급여</th></tr>
        </thead>
        <tbody>
          <tr th:each="d : ${list}">
            <td th:text="${d.deptId}">D1</td>
            <td th:text="${d.deptTitle}">인사관리부</td>
            <td th:text="${d.locationName} ?: '미배정'">한국</td>
            <td th:text="${d.empCount} + '명'">3명</td>
            <td th:text="${d.avgSalary} != null ? ${#numbers.formatInteger(d.avgSalary, 0, 'COMMA')} + '원' : '-'">2,606,000원</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container container--wide row row--between">
      <p>👔 사원관리 · 학습용 프로토타입</p>
      <span class="muted" style="font-size: var(--text-sm)">디자인 시스템: /css/basic.css</span>
    </div>
  </footer>

  <!-- 부서 추가 모달 -->
  <div class="modal" id="dept-modal" data-modal hidden>
    <div class="modal__overlay" data-modal-close></div>
    <div class="modal__panel" role="dialog" aria-modal="true" tabindex="-1" aria-labelledby="dept-modal-title" style="width: min(440px, 100%)">
      <button class="modal__close" type="button" data-modal-close aria-label="닫기">×</button>
      <h3 class="modal__title" id="dept-modal-title">부서 추가</h3>
      <form id="dept-form" class="modal__body stack" style="--gap: var(--space-4)" method="post" th:action="@{/dept-save}">
        <div class="field">
          <label class="label" for="d-code">부서 코드 *</label>
          <input class="input" id="d-code" name="deptId" placeholder="DA (2자)" maxlength="2" required>
        </div>
        <div class="field">
          <label class="label" for="d-name">부서명 *</label>
          <input class="input" id="d-name" name="deptTitle" placeholder="신사업개발부" required>
        </div>
        <div class="field">
          <label class="label" for="d-loc">근무지 *</label>
          <!-- DB의 dept.location_id가 NOT NULL(+FK)이라 근무지는 선택 필수 -->
          <select class="select" id="d-loc" name="locationId" required>
            <option value="">선택하세요</option>
            <option th:each="loc : ${locations}" th:value="${loc.code}" th:text="${loc.name}">한국</option>
          </select>
        </div>
      </form>
      <div class="modal__footer">
        <button class="btn btn--secondary" type="button" data-modal-close>취소</button>
        <button class="btn btn--primary" type="submit" form="dept-form">추가</button>
      </div>
    </div>
  </div>
</body>
</html>
