<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>대시보드 · 사원관리</title>
  <link rel="stylesheet" th:href="@{/css/basic.css}">
  <link rel="stylesheet" th:href="@{/css/component.css}">
  <link rel="stylesheet" th:href="@{/css/app-shell.css}">
  <link rel="stylesheet" th:href="@{/css/hr.css}">
  <script th:src="@{/js/component.js}" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner container container--wide">
      <a class="site-header__brand" th:href="@{/emps}">👔 사원관리</a>
      <nav class="site-nav hide-mobile" aria-label="주요 메뉴">
        <a th:href="@{/emps}">사원 목록</a>
        <a th:href="@{/depts}">부서</a>
        <a th:href="@{/dashboard}" aria-current="page">대시보드</a>
      </nav>
      <span class="spacer"></span>
      <button class="btn btn--ghost btn--sm" type="button" data-theme-toggle aria-label="다크 모드 전환">🌓</button>
      <a class="btn btn--primary btn--sm" th:href="@{/login}">로그인</a>
    </div>
  </header>

  <main class="app-main container container--wide">
    <div class="page-head">
      <div>
        <h1>대시보드</h1>
      </div>
    </div>

    <!-- 통계 카드 -->
    <div class="stat-grid">
      <div class="stat">
        <p class="stat__label">전체 사원</p>
        <p class="stat__value" th:text="${totalCnt} + '명'">21명</p>
      </div>
      <div class="stat">
        <p class="stat__label">재직 중</p>
        <p class="stat__value" th:text="${activeCnt} + '명'">20명</p>
        <p class="stat__delta muted" th:text="'퇴사 ' + ${inactiveCnt} + '명'">퇴사 1명</p>
      </div>
      <div class="stat">
        <p class="stat__label">부서</p>
        <p class="stat__value" th:text="${deptCnt} + '개'">9개</p>
      </div>
      <div class="stat">
        <p class="stat__label">평균 월급여</p>
        <p class="stat__value" th:text="${avgSalary} != null ? ${#numbers.formatInteger(avgSalary, 0, 'COMMA')} + '원' : '-'">318만원</p>
      </div>
    </div>

    <div class="grid grid--2 mt-6">
      <!-- 부서별 인원 -->
      <div class="card" style="padding: var(--space-6)">
        <h3 class="mb-4">부서별 인원</h3>
        <div class="bar-row" th:each="d : ${deptStats}">
          <span class="bar-row__name" th:text="${d.deptTitle}">해외영업1부</span>
          <div class="progress">
            <div class="progress__bar"
                 th:style="'width: ' + (${totalCnt} > 0 ? (${d.empCount} * 100 / ${totalCnt}) : 0) + '%'"></div>
          </div>
          <span class="bar-row__count" th:text="${d.empCount} + '명'">5명</span>
        </div>
      </div>

      <!-- 최근 입사자 -->
      <div class="card" style="padding: var(--space-6)">
        <h3 class="mb-4">최근 입사자</h3>
        <table class="table">
          <thead><tr><th>이름</th><th>부서</th><th>입사일</th></tr></thead>
          <tbody>
            <tr th:each="e : ${recentHires}">
              <td><a th:href="@{/emp-detail(empId=${e.empId})}" th:text="${e.empName}">한규원</a></td>
              <td th:text="${e.deptName} ?: '미배정'">미배정</td>
              <td th:text="${e.hireDate}">2023-03-01</td>
            </tr>
          </tbody>
        </table>
        <a class="link-arrow mt-4" th:href="@{/emps}" style="display: inline-block">전체 사원 보기</a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container container--wide row row--between">
      <p>👔 사원관리 · 학습용 프로토타입</p>
      <span class="muted" style="font-size: var(--text-sm)">디자인 시스템: /css/basic.css</span>
    </div>
  </footer>
</body>
</html>
